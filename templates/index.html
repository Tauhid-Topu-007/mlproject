<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Exam Predictor</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: white;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
        }

        h2 {
            margin-bottom: 30px;
        }

        a.btn {
            background: #ffffff;
            color: #2575fc;
            font-weight: 600;
            border-radius: 12px;
            padding: 12px 25px;
            text-decoration: none;
            transition: 0.3s;
        }

        a.btn:hover {
            background: #2575fc;
            color: white;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>📘 Welcome to Student Exam Predictor</h2>
        <p>Click the button below to predict exam performance!</p>
        <a href="/predictdata" class="btn">Go to Prediction Page</a>
    </div>

</body>
</html>
